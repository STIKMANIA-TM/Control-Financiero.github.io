<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1976d2">
  <meta name="description" content="Control financiero personal con pilares, ciclo de propinas y modelo Wilson">
  <title>Control Financiero - Adrián</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens.css">

  <style>
    .boot-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #666; font-size: 0.95rem;
    }
    .boot-screen .boot-logo { font-size: 3rem; animation: bootPulse 1.2s infinite; }
    @keyframes bootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">💰</div>
      <div>Iniciando Control Financiero...</div>
    </div>
  </div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;">
      Esta aplicación requiere JavaScript habilitado.
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
