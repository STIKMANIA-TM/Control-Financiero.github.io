<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1976d2">
  <meta name="description" content="Control financiero personal con pilares, ciclo de propinas y modelo Wilson">
  <title>Control Financiero - Adrián</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/screens.css">

  <style>
    .boot-screen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #666; font-size: 0.95rem; padding: 20px; text-align: center;
    }
    .boot-screen .boot-logo { font-size: 3rem; animation: bootPulse 1.2s infinite; }
    @keyframes bootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    #bootError {
      max-width: 500px; background: #f8d7da; color: #721c24;
      padding: 12px; border-radius: 10px; font-size: 0.8rem;
      font-family: monospace; white-space: pre-wrap; display: none;
    }
    #bootError.visible { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">💰</div>
      <div>Iniciando Control Financiero...</div>
      <div id="bootError"></div>
    </div>
  </div>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:sans-serif;">
      Esta aplicación requiere JavaScript habilitado.
    </div>
  </noscript>

  <!-- Diagnóstico de arranque: muestra errores de módulos en pantalla -->
  <script>
    (function () {
      var box = document.getElementById('bootError');
      function pintar(msg) {
        if (!box) return;
        box.textContent = msg;
        box.classList.add('visible');
      }
      // Errores de scripts/módulos que no cargan (404, CORS, sintaxis)
      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          pintar('❌ No se pudo cargar el módulo:\n' + (e.target.src || 'desconocido') +
                 '\n\nVerifica que el archivo exista y que estés usando un servidor HTTP (no file://).');
        } else if (e.message) {
          pintar('❌ ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        pintar('❌ Promesa rechazada: ' + ((e.reason && e.reason.message) || e.reason));
      });
      // Si en 10s no arrancó, algo está colgado
      setTimeout(function () {
        if (box && !box.textContent && document.getElementById('app').querySelector('.boot-screen')) {
          pintar('⏳ La app no terminó de iniciar en 10s.\nAbre la consola (F12) para ver el detalle.');
        }
      }, 10000);
    })();
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
